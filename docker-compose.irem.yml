# docker-compose.irem.yml
#
# This file is the Docker Compose configuration that serves IREM data.
# It defines the volumes and networks that are shared across all services.

volumes:
  app_data:
    name: app_data
    driver: local
  grafana_data:
    name: grafana_data
    driver: local
  influxdb_data:
    name: influxdb_data
    driver: local
  influxdb_config_data:
    name: influxdb_config_data
    driver: local
  prometheus_data:
    name: prometheus_data
    driver: local
  elastic_data:
    name: elastic_data
    driver: local

networks:
  app_network:
    name: app_network
    driver: bridge
    enable_ipv6: false

services:
  app:
    extends:
      file: ./docker-compose/docker-compose.app.yml
      service: app
    container_name: app-default
    image: app-default:latest
    environment:
      - IS_USING_IREM=1
      - IS_USING_RADEM=0
      - IREM_MAGFIELD_FETCH_MODE=${IREM_MAGFIELD_FETCH_MODE:-seed}
      - IREM_MAGFIELD_SEED_PATH=/app/seeds/irem/magfield_data.h5
      - IREM_PITCH_ANGLE_FETCH_MODE=${IREM_PITCH_ANGLE_FETCH_MODE:-seed}
    volumes:
      - ${DATA_IREM_RAW_DIR}:/app_data/irem/raw:ro
      - ${IREM_MAGFIELD_SEED_PATH:-./magfield_data_full.h5}:/app/seeds/irem/magfield_data.h5:ro
      - ${IREM_PITCH_ANGLE_SEED_PATH:-./irem_magnetic_pitch_angle_full.h5}:/app/seeds/irem/pitch_angle_full.h5:ro
      - ${IREM_KERNELS_SEED_PATH:-./irem_kernels}:/app/seeds/irem/kernels:ro
  grafana:
    extends:
      file: ./docker-compose/docker-compose.grafana.yml
      service: grafana
    container_name: grafana-default
    ports:
      - "80:3000"
    volumes:
      - ./grafana/grafana.default.ini:/etc/grafana/grafana.ini
      - ./grafana/dashboards/specific/IREM:/etc/grafana/dashboards/specific

  grafana-init-users:
    extends:
      file: ./docker-compose/docker-compose.grafana-init-users.yml
      service: grafana-init-users

  cadvisor:
    extends:
      file: ./docker-compose/docker-compose.cadvisor.yml
      service: cadvisor

  node-exporter:
    extends:
      file: ./docker-compose/docker-compose.node-exporter.yml
      service: node-exporter

  prometheus:
    extends:
      file: ./docker-compose/docker-compose.prometheus.yml
      service: prometheus

  influxdb:
    extends:
      file: ./docker-compose/docker-compose.influxdb.yml
      service: influxdb

  elasticsearch:
    extends:
      file: ./docker-compose/docker-compose.elasticsearch.yml
      service: elasticsearch

  logstash:
    extends:
      file: ./docker-compose/docker-compose.logstash.yml
      service: logstash

  kibana:
    extends:
      file: ./docker-compose/docker-compose.kibana.yml
      service: kibana
